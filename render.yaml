services:
  - type: web
    name: finovert-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: OTP_DEV_API_KEY
        sync: false
      - key: OTP_DEV_TEMPLATE_ID
        sync: false
      - key: OTP_DEV_SENDER_ID
        sync: false
      - key: DEMO_OTP_ENABLED
        value: "0"

  - type: static
    name: finovert-dashboard
    rootDir: backend/dashboard
    publishDir: .

